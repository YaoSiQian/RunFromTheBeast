menus:
  shop:
    inventoryName: '&8商店菜单'
    inventoryRows: 6
    inventorySounds:
    - ORB_PICKUP
    items:
      KitRunner:
        name: '&a跑者套装'
        slot: 21
        lore:
        - '&e点击打开跑者套装菜单'
        item: MAP
        toggle: true
      KitKiller:
        name: '&a杀手套装'
        slot: 22
        lore:
        - '&e点击打开杀手套装菜单'
        item: IRON_SWORD
        toggle: true
      KitBeast:
        name: '&a野兽套装'
        slot: 23
        lore:
        - '&e点击打开野兽套装菜单'
        item: FIREWORK
        toggle: true
      Boost:
        name: '&a游戏加速器'
        slot: 31
        lore:
        - '&e点击打开加速菜单'
        item: EXPERIENCE_BOTTLE
        toggle: true
  gameMain:
    inventoryName: '&8游戏选择'
    inventoryRows: 6
    inventorySounds:
    - ORB_PICKUP
    inventoryGameOpen:
      toggle: true
      gameType: CLASSIC
    items:
      Classic:
        name: '&a经典模式'
        slot: 21
        lore:
        - '&e查看经典模式地图'
        item: LIME_BANNER
        toggle: true
      Infected:
        name: '&a感染模式 &b&l全新！'
        slot: 22
        lore:
        - '&e查看感染模式地图'
        item: PINK_BANNER
        toggle: true
      Double:
        name: '&a双子野兽模式 &b&l全新！'
        slot: 23
        lore:
        - '&e点击查看双手野兽模式地图'
        item: CYAN_BANNER
        toggle: true
      Killer:
        name: '&a杀手模式 &c&l尽请期待'
        slot: 30
        lore:
        - '&e'
        item: RED_BANNER
        toggle: true
      Island:
        name: '&a岛屿模式 &c&l尽请期待'
        slot: 31
        lore:
        - '&e'
        item: YELLOW_BANNER
        toggle: true
      IslandDouble:
        name: '&a岛屿双子模式 &c&l尽请期待'
        slot: 32
        lore:
        - '&e'
        item: GREEN_BANNER
        toggle: true
      IslandKiller:
        name: '&a岛屿杀手模式 &c&l尽请期待'
        slot: 40
        lore:
        - '&e'
        item: ORANGE_BANNER
        toggle: true
    directOpen:
      toggle: false
      gameType: CLASSIC
  kits:
    inventoryName: '&8套装菜单'
    inventoryRows: 3
    inventorySounds:
    - ORB_PICKUP
    blocked-item:
      toggle: true
      item: STAINED_GLASS_PANE:14
      name: '&c&n套装：%kit_name%'
      lore:
      - ' '
      - '&7价格：&6%price%'
      - ' '
      - '&ewww.servername.com'
  game:
    inventoryName: '&8游戏'
    inventoryRows: 3
    showPlayersInItem: true
    inventorySounds:
    - ORB_PICKUP
    item-status:
      waiting: STAINED_CLAY:5
      starting: STAINED_CLAY:4
      playing: STAINED_CLAY:14
      ending: STAINED_CLAY:11
    item:
      name: '&e&n地图：%map_name%'
      lore:
      - ' '
      - '&7状态：&b%map_status%'
      - '&7模式：&b%map_mode%'
      - '&7玩家：&b%map_on%/%map_max%'
      - ' '
      - '&ewww.servername.com'
