settings:
  update-check: false
  language: cn
  default-kits:
    toggle: true
    runner: 0
    beast: 0
    killer: 0
  leaveCMDs:
  - /leave
  - /quit
  - /salir
  dateFormat: yyyy/MM/dd
  perWorldTab: true
  leaveCancelTime: 3
  lobby:
    location: lobby,0.5167398490722768,76.0,0.48117617674284396,179.5501,-0.74999344
    chat: false
    show-all-players: false
    bossBar: true
    actionBar: true
    cancelDamage: true
    blockInventoryClick: true
    noHunger: true
    disableWeather: true
    cancelBlockPlace: true
    cancelBlockBreak: true
    voidSpawnTP: true
    scoreboard-only-in-lobby-world: false
    items-only-in-lobby-world: false
    join:
      teleport: true
      autoHeal: true
      clearInventory: true
      gamemode: ADVENTURE
      message: false
    quit:
      message: false
      statics: false
    Hub-servers:
    - Hub1
    - Hub2
  pointSystem:
    runners:
      death: -6
      win: 4
      kill: 2
    beasts:
      death: -4
      win: 4
      kill: 1
  tags:
    runners:
      toggle: true
      tag: '&b&l跑者'
    beasts:
      toggle: true
      tag: '&c&l野兽'
    killer:
      toggle: true
      tag: '&a&l杀手'
  signs:
    line1: '&l%arena%'
    line2: '%gameStatus%'
    line3: '%on%/%max%'
    line4: '&n点击加入'
  status:
    blocks:
      toggle: false
      preparing: STAINED_GLASS:11
      waiting: STAINED_GLASS:5
      starting: STAINED_GLASS:4
      playing: STAINED_GLASS:14
      InGame: STAINED_GLASS:14
      ending: STAINED_GLASS:0
    color:
      preparing: '&5准备中'
      waiting: '&a等待中'
      starting: '&e开始中'
      playing: '&c游玩中'
      InGame: '&4在游戏中'
      ending: '&9重载中'
    names:
      preparing: 准备中
      waiting: 等待中
      starting: 开始中
      playing: 游玩中
      InGame: 在游戏中
      ending: 重载中
  game:
    show-game-buttons-on-end: false
    beastDistance:
      toggle: true
      Format: BOSSBAR
    commands:
      toggle: true
      type: WHITELIST
      list:
      - leave
      - salir
      - rftb
      - grftb
      - lobby
      - hub
      - exit
    game-actions:
      win-actions:
        toggle: false
        values:
        - <console>eco give <player_name> 100
      end-actions:
        toggle: false
        values:
        - <actionbar>&aWell played!
      restart-actions:
        toggle: false
        values:
        - <actionbar>&bGood Luck for your next game!
      start-actions:
        toggle: false
        values:
        - <msg>&a&lGood Luck!
      selected-beast-actions:
        toggle: false
        values:
        - <actionbar>&c<arena_beast> was selected!
    roles:
      beast: 野兽
      beasts: 野兽
      runner: 跑者
      runners: 跑者
      killer: 杀手
      killers: 杀手
    modes:
      DOUBLE_BEAST: 双子野兽
      CLASSIC: 经典
      INFECTED: 感染
      KILLER: 杀手模式
      ISLAND_OF_THE_BEAST: 野兽之岛
      ISLAND_OF_THE_BEAST_DOUBLE: 双子野兽之岛
      ISLAND_OF_THE_BEAST_KILLER: 野兽杀手之岛
      HISTORY_MODE: 历史模式
  timer:
    weeks: 周
    week: 周
    days: 天
    day: 天
    minutes: 分
    minute: 分
    seconds: 秒
    second: 秒
